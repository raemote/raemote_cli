name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: raemote-darwin-arm64
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: raemote-darwin-x86_64
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: raemote-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: raemote-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/raemote dist/
          cp target/${{ matrix.target }}/release/raemoted dist/
          tar -C dist -czf ${{ matrix.asset }}.tar.gz raemote raemoted

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum *.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            checksums.txt
          # Notes from the commits since the last release; the Gitee mirror
          # carries the same body across.
          generate_release_notes: true
