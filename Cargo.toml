[package]
name = "raemote"
version = "0.1.2"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Private, account-free access to the web apps running on your own machine."
repository = "https://github.com/raemote/raemote_server"
homepage = "https://github.com/raemote/raemote_server"
readme = "README.md"
keywords = ["self-hosted", "remote-access", "p2p", "iroh", "tunnel"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.91"
# Keep the published crate to what `cargo install` and library users need:
# the 1.3 MB app icon, the repo's tooling and the site docs stay in the repo.
exclude = [
    "/.github",
    "/dist",
    "/docs",
    "/examples",
    "/scripts",
    "/skills",
    "/install.sh",
    "/Raemote_ICON.png",
    "/testflight_badge.svg",
    "/RELEASING.md",
]

[lib]
name = "raemote"

[[bin]]
name = "raemoted"
path = "src/bin/raemoted.rs"

[[bin]]
name = "raemote"
path = "src/bin/raemote.rs"

[dependencies]
iroh = "1.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs", "process"] }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.10"
leaky-bucket = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
qrcode = { version = "0.14.1", default-features = false }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
listeners = "0.6"
url = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
